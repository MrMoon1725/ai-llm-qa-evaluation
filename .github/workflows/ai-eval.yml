name: AI Quality Evaluation Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI QA Evaluation Suite
        run: pytest -v --html=reports/ai-eval-report.html --self-contained-html

      - name: Upload Evaluation HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: reports/ai-eval-report.html
          retention-days: 30
